<h2>Autentificare</h2>
<p>Folosește linkul de mai jos pentru a te autentifica. Linkul poate fi folosit o singură dată și expiră într-o oră.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}">Intră în cont</a></p>
<p>Dacă nu ai cerut acest email, îl poți ignora.</p>
