name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit

      - name: Supabase local
        run: pnpm db:start
      - name: Env din Supabase local
        run: node scripts/ci-env.mjs >> "$GITHUB_ENV"
      - name: DB tests (RLS + funcții SQL)
        run: pnpm test:db

      - name: Build imagine worker
        run: docker build -f apps/worker/Dockerfile -t memories-worker .
      - name: Test de fum HEIC
        run: docker run --rm memories-worker node scripts/smoke-heic.ts
      # Testele media rulează în imagine (heif-dec, ffmpeg, ExifTool); `--user root` pentru
      # fișierul temporar pe care Vitest îl scrie lângă configurație.
      - name: Teste worker (în imagine, pe fixtures reale)
        run: >
          docker run --rm --network host --user root
          -e DATABASE_URL -e SUPABASE_URL -e SUPABASE_SERVICE_ROLE_KEY
          -e S3_ENDPOINT -e S3_REGION -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY
          -e SMTP_HOST -e SMTP_PORT -e SMTP_FROM -e APP_URL
          memories-worker sh -c "cd /app && node_modules/.bin/vitest run --project worker"

      - name: Pornește worker-ul
        run: >
          docker run -d --name worker --network host
          -e DATABASE_URL -e SUPABASE_URL -e SUPABASE_SERVICE_ROLE_KEY
          -e S3_ENDPOINT -e S3_REGION -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY
          -e SMTP_HOST -e SMTP_PORT -e SMTP_FROM -e APP_URL
          memories-worker
      - name: Instalează browserele Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - name: E2E (inclusiv LCP pe profil mobil)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - name: Loguri worker
        if: failure()
        run: docker logs worker

  publish-worker:
    # Doar pe main, după ce toate verificările au trecut (apps/worker/deploy/scaleway-container.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Autentificare în Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin
      - name: Build și publicare imagine
        run: |
          IMAGE=rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}/memories-worker
          docker build -f apps/worker/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
